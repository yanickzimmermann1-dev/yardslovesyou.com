      <p class="eyebrow">ADMIN</p>
      <h1>Sound Drop <span>versenden</span></h1>
      <p class="muted">Diese Seite ist nur für dich. Ohne Admin-Schlüssel kann hier niemand etwas tun.</p>

          <label for="test">1. Zuerst einen Test an dich schicken</label>
          <div class="free-kit-row">
            <input id="test" type="email" placeholder="deine@email.com">
            <button class="outline" id="send-test" type="button">Test senden</button>
          </div>
        </div>

        <div class="field">
          <label>2. Dann an alle Abonnenten senden</label>
          <div><button class="button" id="send-all" type="button">An alle senden</button></div>
          <label class="consent"><input id="force" type="checkbox"> <span>Erneut senden, obwohl dieser Drop schon verschickt wurde</span></label>
        </div>
      </div>

      <p class="status" id="msg" role="status"></p>
    </section>
