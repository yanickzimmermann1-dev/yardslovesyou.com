
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0b12">
  <title>Shop · YARDSLOVESYOU</title>

  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header class="topbar">
    <a class="brand" href="index.html">
      YARDS<span>LOVES<span>YOU</span></span>
    </a>

    <nav>
      <a href="index.html">Home</a>
      <a class="active" href="shop.html">Shop</a>
    </nav>

    <a class="outline nav-admin" href="index.html#admin-panel">Admin</a>
  </header>

  <main class="wrap">

    <section class="hero shop-hero">
      <p class="eyebrow">DIGITAL PRODUCTS</p>
      <h1>Organic sounds,<br><span>ready to download</span></h1>
      <p class="muted">
        Instrumentals, one-shots, drums and more
      </p>
      <a class="button" href="#downloads">Products</a>
    </section>

    <section class="section-head" id="downloads">
      <div>
        <p class="eyebrow"></p>
        <h2>Shop</h2>
      </div>
      <span class="muted" id="shop-count"></span>
    </section>

    <section id="products" class="product-grid" aria-label="Shop-Produkte">
      <div class="empty">Loading …</div>
    </section>

    <p class="fineprint">
      Your product will be available as a zip-download.
    </p>

    <section id="download-result" class="admin-panel hidden"
      aria-live="polite"></section>

  </main>

  <footer>
    <span>© <span id="year"></span> YARDSLOVESYOU</span>
    <span><a href="index.html"><3</a></span>
  </footer>

  <script src="config.js"></script>
  <script src="shop.js"></script>
</body>
</html>
