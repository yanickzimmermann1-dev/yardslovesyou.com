
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0b12">
  <title>Shop · YARDSLOVESYOU</title>

  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header class="topbar">
    <a class="brand" href="index.html">
      YARDS<span>LOVES<span>YOU</span></span>
    </a>

    <nav>
      <a href="index.html">Home</a>
      <a class="active" href="shop.html">Shop</a>
      <a class="active" href="upload.html">Upload</a>
    </nav>

    <a class="outline nav-admin" href="index.html#admin-panel">Admin</a>
  </header>

  <main class="wrap">

    <section class="hero shop-hero">
      <p class="eyebrow">DIGITAL PRODUCTS</p>
      <h1>Organic sounds,<br><span>ready to download</span></h1>
      <p class="muted">
        Instrumentals, one-shots, drums and more
      </p>
      <a class="button" href="#downloads">Products</a>
    </section>

    <section class="section-head" id="downloads">
      <div>
        <p class="eyebrow"></p>
        <h2>Shop</h2>
      </div>
      <span class="muted" id="shop-count"></span>
    </section>

    <section id="products" class="product-grid" aria-label="Shop-Produkte">
      <div class="empty">Loading …</div>
    </section>

    <p class="fineprint">
      Your product will be available as a zip-download.
    </p>

    <section id="download-result" class="admin-panel hidden"
      aria-live="polite"></section>

  </main>

  <footer>
  <div style="display: flex; flex-direction: column; width: 100%; gap: 16px;">
    <!-- Erste Zeile: Copyright links, Herz rechts -->
    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
      <span>© <span id="year">2026</span> YARDSLOVESYOU</span>
      <span>&lt;3</span>
    </div>
    
    <!-- Zweite Zeile: Links zentriert mit Abstand -->
    <div style="display: flex; justify-content: center; gap: 20px; font-size: 11px; color: var(--muted); margin-top: 12px;">
      <a href="code-of-conduct.html">Code of Conduct</a>
      <a href="contributing.html">Contributing</a>
      <a href="license.html">License</a>
      <a href="security.html">Security</a>
    </div>
  </div>
</footer>

  <script src="config.js"></script>
  <script src="shop.js"></script>
</body>
</html>
