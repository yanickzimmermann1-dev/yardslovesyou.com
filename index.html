<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>
  <link rel="stylesheet" href="styles.css">
  <!-- WICHTIG: UMD-Build für globales window.supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">YARDS<span>LOVES<span>YOU</span></a>
  <nav>
    <a class="active" href="index.html">Home</a>
    <a href="shop.html">Shop</a>
  </nav>
</header>

<main class="wrap">
  <section class="hero">
    <p class="eyebrow">SOUND DESIGN · PRODUCTION</p>
    <h1>Sounds that<br><span>stay with you.</span></h1>
    <p class="muted"></p>
    <a class="button" href="shop.html">Shop</a>
  </section>

  <section class="section-head">
    <div>
      <p class="eyebrow"></p>
      <h2></h2>
    </div>
    <p class="muted"></p>
  </section>

  <div id="tracks" class="track-grid">
    <div class="empty">Lade Tracks …</div>
  </div>
</main>

<!-- Admin-Bereich fixiert unten rechts -->
<div id="admin-container-bottom">
  <button id="admin-toggle" class="outline" title="Admin-Bereich öffnen">Admin</button>
  
  <div id="admin-panel" class="admin-panel hidden">
    <h2>Admin-Bereich</h2>
    <p class="muted">Melde dich an, um Audiodateien oder Cover hochzuladen oder Tracks zu entfernen.</p>
    
    <form id="login-form" class="login-form">
      <input id="email" type="email" placeholder="E-Mail" required>
      <input id="password" type="password" placeholder="Passwort" required>
      <button class="button">Anmelden</button>
    </form>
    
    <div id="admin-tools" class="hidden">
      <div id="dropzone" class="dropzone">
        <strong>Dateien hier ablegen</strong>
        <span>oder auswählen · Audio & Bilder</span>
        <input id="audio-files" type="file" accept="audio/*,image/*" multiple>
      </div>
      <button id="logout" class="outline">Abmelden</button>
    </div>
    
    <p id="status" class="status" role="status"></p>
  </div>
</div>

<footer>
  <span>© <span id="year"></span> YARDSLOVESYOU</span>
  <span>&lt;3</span>
</footer>

<script src="config.js"></script>
<script src="home.js"></script>
</body>
</html>
